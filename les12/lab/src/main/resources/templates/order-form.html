<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novyj zakaz</title>
    <style>
        body { font-size: 16px; }
        select, input[type="text"] { font-size: 16px; padding: 5px; }
        table { border-collapse: collapse; width: 70%; margin-top: 20px; }
        th, td { border: 1px solid #aaa; padding: 10px; }
        input[type="submit"] { font-size: 18px; padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>
<h1>Sozdanie zakaza</h1>
<form th:action="@{/web/orders}" method="post">
    <label>Klient:</label>
    <select name="customerId">
        <option th:each="c : ${customers}" th:value="${c.customerId}" th:text="${c.name}"></option>
    </select>
    <br/><br/>
    <label>Adres dostavki:</label>
    <input type="text" name="shippingAddress" size="40"/>
    <br/><br/>
    <table>
        <tr><th>Tovar</th><th>Cena</th><th>Kol-vo</th></tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td>
                <input type="hidden" name="productIds" th:value="${p.productId}"/>
                <input type="number" name="quantities" min="0" value="0" style="width:80px"/>
            </td>
        </tr>
    </table>
    <br/>
    <input type="submit" value="Sozdat zakaz"/>
</form>
</body>
</html>
